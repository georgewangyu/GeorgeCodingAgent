name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated adapters match sources, frontmatter, duplicate skill names, version bumped
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 tools/jarvis-build.py --check --base "$BASE"
      - name: Bitter-lesson tags
        run: python3 tools/bitter_lesson.py check --root .
      - name: Scrub, judged by the base commit's engine, config and lists
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: tools/ci/scrub-gate.sh "$BASE"
      - name: Scrub with this change's own config and lists
        run: tools/scrub-lint/scripts/scrub-lint check --lists public
